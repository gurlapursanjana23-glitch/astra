<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <!-- IEEE Emblem Diamond -->
  <g transform="translate(10, 5)">
    <!-- Outer Diamond with subtle gradient -->
    <defs>
      <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF8A24"/>
        <stop offset="50%" stop-color="#54218A"/>
        <stop offset="100%" stop-color="#30105E"/>
      </linearGradient>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#E2D9F3"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    
    <!-- Outer Glow Diamond -->
    <polygon points="35,3 67,35 35,67 3,35" fill="#30105E" stroke="#FF8A24" stroke-width="2.5" filter="url(#glow)" opacity="0.8" />
    <polygon points="35,3 67,35 35,67 3,35" fill="#15121C" stroke="#FF8A24" stroke-width="2" />
    
    <!-- Inner IEEE Circle & Arrows Emblem -->
    <circle cx="35" cy="35" r="18" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-dasharray="100" />
    <!-- Magnetic field curved arrows -->
    <path d="M 23 35 A 12 12 0 0 1 47 35" stroke="#FF8A24" stroke-width="2" fill="none" stroke-linecap="round"/>
    <polygon points="46,31 49,36 43,36" fill="#FF8A24"/>
    
    <path d="M 47 35 A 12 12 0 0 1 23 35" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <polygon points="24,39 21,34 27,34" fill="#FFFFFF"/>
    
    <!-- Center Arrows (Right-hand rule) -->
    <line x1="35" y1="20" x2="35" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="35,16 31,23 39,23" fill="#FFFFFF"/>
    <polygon points="35,54 31,47 39,47" fill="#FFFFFF"/>
  </g>

  <!-- Typography: IEEE RRCE CONNECT -->
  <!-- IEEE Wordmark -->
  <text x="86" y="38" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="url(#textGrad)" letter-spacing="1.5">
    IEEE
  </text>
  
  <!-- RRCE Highlight -->
  <text x="162" y="38" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#FF8A24" letter-spacing="1.5">
    RRCE
  </text>
  
  <!-- CONNECT Pill Badge -->
  <rect x="250" y="18" width="88" height="23" rx="6" fill="#30105E" stroke="#54218A" stroke-width="1.2"/>
  <text x="294" y="34" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    CONNECT
  </text>

  <!-- Tagline / Chapter Details -->
  <text x="88" y="56" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#B8B8C5" letter-spacing="1.2">
    STUDENT BRANCH CHAPTER
  </text>
  
  <circle cx="242" cy="53" r="2.5" fill="#FF8A24" />
  
  <text x="252" y="56" font-family="'Poppins', sans-serif" font-size="10" font-weight="500" fill="#FF8A24" letter-spacing="1">
    BANGALORE SECTION
  </text>
</svg>
